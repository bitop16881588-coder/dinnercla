<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚餐报名 · 点餐统计</title>

<!-- ============================================================
     ① 配置区：把部署 Apps Script 后得到的网址粘到下面引号中间
        （以 https://script.google.com/macros/s/…/exec 结尾）
        没填也能用（本地预览模式），填好后数据才会写进 Google 表格
     ============================================================ -->
<script>
  const SHEET_API_URL = "";   // 例如 https://script.google.com/macros/s/AKfyc.../exec
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#f4ecdd;
    --card:#fffdf7;
    --ink:#2c2722;
    --muted:#8a7d6b;
    --line:#e6dcc8;
    --accent:#c7502f;
    --accent-deep:#9c3a1f;
    --green:#3f5e49;
    --green-soft:#e7eee6;
    --shadow:0 2px 0 rgba(44,39,34,.04), 0 14px 30px -18px rgba(44,39,34,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans SC",sans-serif;
    color:var(--ink);
    background:var(--paper);
    background-image:
      radial-gradient(circle at 12% -10%, rgba(199,80,47,.07), transparent 40%),
      radial-gradient(circle at 95% 0%, rgba(63,94,73,.07), transparent 35%);
    background-attachment:fixed;
    line-height:1.6;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  /* —— 顶部 —— */
  header.site{
    padding:34px 0 18px;
    text-align:center;
    position:relative;
  }
  .kicker{
    font-family:"Fraunces",serif;font-style:italic;
    color:var(--accent);font-size:15px;letter-spacing:.04em;
    margin-bottom:4px;
  }
  header.site h1{
    font-family:"Noto Serif SC",serif;font-weight:700;
    font-size:clamp(26px,7vw,38px);line-height:1.15;
    letter-spacing:.01em;
  }
  .event-date{color:var(--muted);font-size:14px;margin-top:6px}
  .event-date::before{content:"📅 ";}

  /* —— 连接状态条 —— */
  .status{
    font-size:12.5px;text-align:center;padding:7px 14px;border-radius:999px;
    display:inline-flex;gap:7px;align-items:center;margin:12px auto 0;
    border:1px solid var(--line);background:var(--card);color:var(--muted);
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:#c9b48d}
  .status.live{color:var(--green);border-color:#bcd0bf;background:var(--green-soft)}
  .status.live .dot{background:var(--green)}

  /* —— 标签页 —— */
  nav.tabs{
    display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:5px;margin:22px 0;box-shadow:var(--shadow);
  }
  nav.tabs button{
    flex:1;border:0;background:transparent;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:500;color:var(--muted);
    padding:11px 4px;border-radius:10px;transition:.18s;
  }
  nav.tabs button.active{background:var(--ink);color:#fff7e9}

  .panel{display:none;animation:rise .4s ease both}
  .panel.show{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* —— 卡片 —— */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .card h2{
    font-family:"Noto Serif SC",serif;font-size:19px;font-weight:600;
    margin-bottom:14px;display:flex;align-items:center;gap:9px;
  }
  .card h2 .em{font-family:"Fraunces";font-style:italic;color:var(--accent);font-weight:500}

  label.fld{display:block;margin-bottom:14px}
  label.fld span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
  input[type=text],input[type=number],textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    background:#fffefb;border:1.5px solid var(--line);border-radius:10px;
    padding:11px 13px;transition:.15s;
  }
  input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,80,47,.12)}
  textarea{resize:vertical;min-height:60px}

  /* 人数加减 */
  .stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fffefb}
  .stepper button{width:42px;height:42px;border:0;background:transparent;font-size:22px;color:var(--accent);cursor:pointer;line-height:1}
  .stepper button:active{background:#f6ece0}
  .stepper .val{min-width:46px;text-align:center;font-size:17px;font-weight:700;font-family:"Fraunces"}

  /* 菜单选择 */
  .dish-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;border-bottom:1px dashed var(--line);
  }
  .dish-row:last-child{border-bottom:0}
  .dish-row .nm{font-size:15.5px;font-weight:500}
  .dish-row .stepper button{width:36px;height:36px;font-size:19px}
  .dish-row .stepper .val{min-width:38px;font-size:15px}
  .dish-row.picked{color:var(--accent-deep)}
  .dish-row.picked .nm::before{content:"● ";color:var(--accent);font-size:11px;vertical-align:1px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    border:0;border-radius:12px;padding:14px 20px;width:100%;transition:.16s;
  }
  .btn-primary{background:var(--accent);color:#fff7ef;box-shadow:0 8px 18px -8px var(--accent)}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-sm{width:auto;padding:8px 14px;font-size:13.5px;font-weight:500}
  .btn-danger{color:var(--accent);background:transparent;border:1.5px solid #e9c9bf}
  .btn-danger:hover{background:var(--accent);color:#fff}

  /* 报名名单 */
  .signup-item{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fffefb;
  }
  .signup-item .who{font-weight:700;font-size:15.5px}
  .signup-item .tag{font-size:12px;color:var(--green);background:var(--green-soft);padding:1px 8px;border-radius:6px;margin-left:6px;font-weight:500}
  .signup-item .ord{font-size:13.5px;color:var(--muted);margin-top:3px}
  .signup-item .nt{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px}
  .del{border:0;background:transparent;color:#c0b29c;cursor:pointer;font-size:18px;padding:2px 4px;flex-shrink:0}
  .del:hover{color:var(--accent)}

  /* 统计 */
  .totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-family:"Fraunces";font-size:42px;font-weight:600;color:var(--accent);line-height:1}
  .stat .l{font-size:13px;color:var(--muted);margin-top:6px}
  .bar-row{margin-bottom:13px}
  .bar-row .top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}
  .bar-row .top b{font-family:"Fraunces";font-weight:600;color:var(--accent-deep)}
  .bar-track{height:11px;background:var(--green-soft);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
  .empty .big{font-size:30px;display:block;margin-bottom:6px;opacity:.6}

  /* 设置里的菜单管理 */
  .menu-edit{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
  .menu-edit:last-child{border-bottom:0}
  .add-dish{display:flex;gap:8px;margin-top:12px}
  .add-dish input{flex:1}
  .add-dish button{flex-shrink:0;width:auto;padding:0 18px}

  .hint{font-size:13px;color:var(--muted);background:#f9f2e4;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:8px}
  .hint code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}

  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px}
  footer .heart{color:var(--accent)}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff7e9;padding:12px 22px;border-radius:999px;
    font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.3s;z-index:50;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:420px){ .totals{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <div class="kicker">Let's eat together</div>
    <h1 id="evTitle">周末聚餐报名</h1>
    <div class="event-date" id="evDate"></div>
    <div><span class="status" id="statusBar"><span class="dot"></span><span id="statusText">连接中…</span></span></div>
  </header>

  <nav class="tabs">
    <button data-tab="signup" class="active">报名</button>
    <button data-tab="stats">统计</button>
    <button data-tab="settings">设置</button>
  </nav>

  <!-- ============ 报名 ============ -->
  <section class="panel show" id="panel-signup">
    <div class="card">
      <h2><span class="em">01</span> 我要报名</h2>
      <label class="fld">
        <span>你的名字</span>
        <input type="text" id="inName" placeholder="例如：小明" maxlength="20">
      </label>
      <label class="fld">
        <span>同行人数（含自己）</span>
        <div class="stepper">
          <button type="button" onclick="bumpHead(-1)">−</button>
          <span class="val" id="headVal">1</span>
          <button type="button" onclick="bumpHead(1)">＋</button>
        </div>
      </label>
      <label class="fld" style="margin-bottom:6px"><span>点餐（按需选择数量）</span></label>
      <div id="dishPick"></div>
      <label class="fld" style="margin-top:14px">
        <span>备注（忌口 / 想说的话，选填）</span>
        <textarea id="inNote" placeholder="例如：不吃香菜，想加个汤"></textarea>
      </label>
      <button class="btn btn-primary" onclick="submitSignup()">✓ 提交报名</button>
    </div>

    <div class="card">
      <h2><span class="em">02</span> 已报名 <span id="cntName" style="font-family:Fraunces;color:var(--accent)"></span></h2>
      <div id="signupList"></div>
    </div>
  </section>

  <!-- ============ 统计 ============ -->
  <section class="panel" id="panel-stats">
    <div class="totals">
      <div class="stat"><div class="n" id="stPeople">0</div><div class="l">总人数</div></div>
      <div class="stat"><div class="n" id="stGroups">0</div><div class="l">报名组数</div></div>
    </div>
    <div class="card">
      <h2><span class="em">🍽</span> 点餐统计</h2>
      <div id="dishStats"></div>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:auto;margin:0 auto;display:flex" onclick="refreshAll(true)">↻ 刷新数据</button>
  </section>

  <!-- ============ 设置 ============ -->
  <section class="panel" id="panel-settings">
    <div class="card">
      <h2><span class="em">⚙</span> 活动信息</h2>
      <label class="fld">
        <span>活动标题</span>
        <input type="text" id="setTitle" maxlength="30">
      </label>
      <label class="fld">
        <span>时间地点（选填）</span>
        <input type="text" id="setDate" placeholder="例如：6月14日 周六 18:00 老地方">
      </label>
      <button class="btn btn-primary btn-sm" style="width:auto" onclick="saveSettings()">保存</button>
    </div>

    <div class="card">
      <h2><span class="em">🥘</span> 菜单管理</h2>
      <div id="menuEdit"></div>
      <div class="add-dish">
        <input type="text" id="newDish" placeholder="新增菜品名称" maxlength="20" onkeydown="if(event.key==='Enter')addDish()">
        <button class="btn btn-primary" onclick="addDish()">添加</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="em">↺</span> 开始新一轮</h2>
      <p style="font-size:14px;color:var(--muted);margin-bottom:12px">清空当前所有报名记录（菜单保留），用于下一次聚餐。此操作不可恢复。</p>
      <button class="btn btn-danger" onclick="clearAll()">清空所有报名</button>
    </div>
  </section>

  <footer>用 <span class="heart">♥</span> 招呼大家吃饭 · 部署在 GitHub Pages</footer>
</div>

<div id="toast"></div>

<script>
/* ===================== 数据层（自动选择 Google Sheets 或 本地） ===================== */
const SEED_DISHES = ["宫保鸡丁","麻婆豆腐","鱼香肉丝","糖醋里脊","清炒时蔬","酸辣土豆丝","番茄蛋汤","白米饭"];

function makeLocalStore(){
  const KEY="fanju_data_v1";
  let mem=null; // 当 localStorage 不可用时的内存兜底
  function read(){
    try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
    if(mem) return mem;
    return null;
  }
  function write(d){
    mem=d;
    try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){}
  }
  function init(){
    let d=read();
    if(!d){
      d={ settings:{title:"周末聚餐报名",event_date:""},
          dishes:SEED_DISHES.map((n,i)=>({id:"d"+i,name:n,sort:i})),
          signups:[] };
      write(d);
    }
    return d;
  }
  return {
    live:false,
    async getSnapshot(){
      const d=init();
      return { settings:d.settings, dishes:d.dishes,
               signups:d.signups.slice().sort((a,b)=>a.created_at>b.created_at?1:-1) };
    },
    async saveSettings(s){ const d=init(); d.settings=s; write(d); },
    async addDish(name){ const d=init(); d.dishes.push({id:"d"+Date.now(),name,sort:d.dishes.length}); write(d); },
    async removeDish(id){ const d=init(); d.dishes=d.dishes.filter(x=>x.id!==id); write(d); },
    async addSignup(s){ const d=init(); d.signups.push({...s,id:"s"+Date.now(),created_at:new Date().toISOString()}); write(d); },
    async removeSignup(id){ const d=init(); d.signups=d.signups.filter(x=>x.id!==id); write(d); },
    async clearSignups(){ const d=init(); d.signups=[]; write(d); }
  };
}

// —— Google Sheets（通过 Apps Script 网址读写）——
function makeSheetsStore(){
  const url=SHEET_API_URL;
  // 写操作用 text/plain 简单请求，避免触发 CORS 预检；写完由 getSnapshot 拉取最新数据
  async function post(payload){
    try{
      const r=await fetch(url,{method:"POST",body:JSON.stringify(payload)});
      const d=await r.json();
      if(d && d.ok===false) throw new Error(d.error||"写入失败");
    }catch(e){ throw e; }
  }
  return {
    live:true,
    async getSnapshot(){
      const r=await fetch(url+"?t="+Date.now());
      const d=await r.json();
      return { settings:d.settings||{}, dishes:d.dishes||[], signups:d.signups||[] };
    },
    async saveSettings(s){ await post({action:"saveSettings",...s}); },
    async addDish(name){ await post({action:"addDish",name}); },
    async removeDish(id){ await post({action:"removeDish",id}); },
    async addSignup(s){ await post({action:"addSignup",...s}); },
    async removeSignup(id){ await post({action:"removeSignup",id}); },
    async clearSignups(){ await post({action:"clearSignups"}); }
  };
}

let store, state={settings:{},dishes:[],signups:[]}, headcount=1, order={};

function bootStore(){
  if(typeof SHEET_API_URL==="string" && SHEET_API_URL.trim()){
    store=makeSheetsStore();
  }else{
    store=makeLocalStore();
  }
}

/* ===================== 渲染 ===================== */
const $=id=>document.getElementById(id);

function setStatus(){
  const bar=$('statusBar'),t=$('statusText');
  if(store.live){ bar.classList.add('live'); t.textContent="已连接 · 写入 Google 表格"; }
  else{ bar.classList.remove('live'); t.textContent="本地预览模式（数据只存在本机）"; }
}

function renderHeader(){
  $('evTitle').textContent=state.settings.title||"周末聚餐报名";
  $('evDate').textContent=state.settings.event_date||"";
  $('evDate').style.display=state.settings.event_date?"block":"none";
  $('setTitle').value=state.settings.title||"";
  $('setDate').value=state.settings.event_date||"";
}

function renderDishPick(){
  const box=$('dishPick');
  if(!state.dishes.length){ box.innerHTML='<div class="empty">还没有菜单，去「设置」里添加菜品</div>'; return; }
  box.innerHTML=state.dishes.map(d=>{
    const q=order[d.name]||0;
    return `<div class="dish-row ${q>0?'picked':''}">
      <span class="nm">${esc(d.name)}</span>
      <div class="stepper">
        <button type="button" onclick="bumpDish('${esc(d.name)}',-1)">−</button>
        <span class="val">${q}</span>
        <button type="button" onclick="bumpDish('${esc(d.name)}',1)">＋</button>
      </div></div>`;
  }).join('');
}

function renderSignups(){
  const list=$('signupList');
  $('cntName').textContent=state.signups.length?`（${state.signups.length}）`:'';
  if(!state.signups.length){ list.innerHTML='<div class="empty"><span class="big">🍵</span>还没有人报名，做第一个吧</div>'; return; }
  list.innerHTML=state.signups.slice().reverse().map(s=>{
    const items=(s.items||[]).filter(i=>i.qty>0);
    const ord=items.length?items.map(i=>`${esc(i.name)}×${i.qty}`).join('、'):'未点餐';
    return `<div class="signup-item">
      <div>
        <div class="who">${esc(s.name)}${s.headcount>1?`<span class="tag">${s.headcount}人</span>`:''}</div>
        <div class="ord">🍴 ${ord}</div>
        ${s.note?`<div class="nt">“${esc(s.note)}”</div>`:''}
      </div>
      <button class="del" title="删除" onclick="delSignup('${s.id}')">✕</button>
    </div>`;
  }).join('');
}

function renderStats(){
  let people=0; const tally={};
  state.signups.forEach(s=>{
    people+=Number(s.headcount)||1;
    (s.items||[]).forEach(i=>{ if(i.qty>0) tally[i.name]=(tally[i.name]||0)+Number(i.qty); });
  });
  $('stPeople').textContent=people;
  $('stGroups').textContent=state.signups.length;
  const rows=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const max=rows.length?rows[0][1]:1;
  const box=$('dishStats');
  if(!rows.length){ box.innerHTML='<div class="empty"><span class="big">📋</span>还没有点餐数据</div>'; return; }
  box.innerHTML=rows.map(([n,c])=>`
    <div class="bar-row">
      <div class="top"><span>${esc(n)}</span><b>${c} 份</b></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(8,c/max*100)}%"></div></div>
    </div>`).join('');
}

function renderMenuEdit(){
  const box=$('menuEdit');
  if(!state.dishes.length){ box.innerHTML='<div class="empty">菜单是空的，在下面添加</div>'; return; }
  box.innerHTML=state.dishes.map(d=>`
    <div class="menu-edit"><span>${esc(d.name)}</span>
      <button class="del" onclick="removeDish('${d.id}')">✕</button></div>`).join('');
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ===================== 交互 ===================== */
function bumpHead(d){ headcount=Math.max(1,headcount+d); $('headVal').textContent=headcount; }
function bumpDish(name,d){ order[name]=Math.max(0,(order[name]||0)+d); renderDishPick(); }

async function submitSignup(){
  const name=$('inName').value.trim();
  if(!name){ toast('请先填名字～'); $('inName').focus(); return; }
  const items=state.dishes.map(d=>({name:d.name,qty:order[d.name]||0})).filter(i=>i.qty>0);
  try{
    await store.addSignup({name,headcount,items,note:$('inNote').value.trim()});
    $('inName').value=''; $('inNote').value=''; headcount=1; order={};
    $('headVal').textContent=1;
    await refreshAll();
    renderDishPick();
    toast('报名成功 🎉');
  }catch(e){ toast('提交失败：'+(e.message||e)); }
}

async function delSignup(id){
  if(!confirm('删除这条报名？')) return;
  try{ await store.removeSignup(id); await refreshAll(); toast('已删除'); }
  catch(e){ toast('删除失败：'+(e.message||e)); }
}

async function saveSettings(){
  try{
    await store.saveSettings({title:$('setTitle').value.trim()||'周末聚餐报名',event_date:$('setDate').value.trim()});
    await refreshAll(); toast('已保存');
  }catch(e){ toast('保存失败：'+(e.message||e)); }
}

async function addDish(){
  const n=$('newDish').value.trim();
  if(!n) return;
  try{ await store.addDish(n); $('newDish').value=''; await refreshAll(); }
  catch(e){ toast('添加失败：'+(e.message||e)); }
}

async function removeDish(id){
  try{ await store.removeDish(id); await refreshAll(); }
  catch(e){ toast('删除失败：'+(e.message||e)); }
}

async function clearAll(){
  if(!confirm('确定清空所有报名记录吗？此操作不可恢复。')) return;
  try{ await store.clearSignups(); await refreshAll(); toast('已清空，可以开始新一轮'); }
  catch(e){ toast('操作失败：'+(e.message||e)); }
}

let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ===================== 标签页 & 轮询 ===================== */
let pollTimer;
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('show'));
    b.classList.add('active');
    $('panel-'+b.dataset.tab).classList.add('show');
    clearInterval(pollTimer);
    if(b.dataset.tab==='stats' && store.live){
      pollTimer=setInterval(()=>refreshAll(),8000); // 实时模式下统计页自动刷新
    }
  };
});

/* ===================== 加载 ===================== */
async function refreshAll(manual){
  try{
    const {settings,dishes,signups}=await store.getSnapshot();
    state={settings,dishes,signups};
    renderHeader(); renderDishPick(); renderSignups(); renderStats(); renderMenuEdit();
    if(manual) toast('已刷新');
  }catch(e){ toast('读取失败：'+(e.message||e)); }
}

(async function init(){
  bootStore();
  setStatus();
  await refreshAll();
})();
</script>
</body>
